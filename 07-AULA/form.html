<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>
<body>


    <form action="">
        <!-- Diledset - segmenta visualmente o formulario -->
        <fieldset>
            <!-- legend - tiulo do segmento -->
            <legend> Dados Pessoais</legend>

            <!-- Caixinha de nome -->
            <label for="nome"> Nome: </label>
            <input type="text" name="nome" id="nome">
            <!-- Fim Caixinha de nome -->

            <br> <br>


            <!-- Caixinha data de nascimento -->
            <label for="">Data de nascimento: </label>
            <!-- date - apenas data -->
            <input type="date" name="" id="">
            <!-- datetime - mostra data e hora juntos -->
            <input type="datetime-local">
            <!-- time - apenas hora -->
            <input type="time">
            <!-- Fim Caixinha data de nascimento -->

            <br> <br>


            <!-- Caixinha de numeros -->
            <label for="filhos">Quantidade de Filhos: </label>
            <input type="number" name="filhos" id="filhos" min="-3" max="301" step="0.7" value="5">
            
            <!-- Fim Caixinha de numeros -->

        </fieldset>

    </form>


</body>
</html>
