<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>
<body>

<!-- Tabelas -->
<header>
    <h1> Tabelas top</h1>
</header>

<main>

</main>
    <h2>Produtos</h2>

    <!-- TABLE = Criação de table -->
    <table border="5">

        <!-- THEAD = Cabeçalho da tabela -->
        <thead>

            <!-- TR = Criação de uma linha da tabela -->
            <tr>

                <!--TH  = COLUNA DE UM CABEÇALHO-->
                <th> ID </th>
                <th>NOME</th>
                <th>QUANTIDADE</th>
                <th>PREÇO </th>
                <th>CATEGORIA</th>
            </tr>
        </thead>

        <!-- TBODY = CORPO DA TABELA -->
        <tbody>
            <tr>

                <!-- TD = CELULA DA LINHA DO CORPO -->
                <td>1</td>
                <td>Shampoo CR7</td>
                <td>7</td>
                <td>R$77,7</td>
                <td>Beleza</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Shampoo Vini Jr</td>
                <td>7</td>
                <td>R$ 77</td>
                <td>Beleza</td>
            </tr>

            <tr>
                <td>3</td>
                <td>Shampoo Haaland</td>
                <td>9</td>
                <td>R$ 99</td>
                <td>Beleza</td>
            </tr>

            <tr>
                <td>4</td>
                <!-- colspan = diz quantas colunas a célula vai ocupar -->
                <td colspan="3">Mucilon 500g</td>
                <!-- rowspan = diz quantas linhas a célula vai ocupar -->
                <td rowspan="2">Filhos</td>
            </tr>

            <tr>
                <td>5</td>
                <td>Lavador nasal</td>
                <td>1</td>
                <td>R$ 30</td>
            </tr>


        </tbody>
    
        <!-- TFOOT - RODAPÉ DA TABELA -->
        <tfoot>
            <tr>
                <td colspan="10"> Tabela feita por: Dougras</td>
            </tr>
        </tfoot>
        
    </table>
<footer>
    <p>Segue noís</p>
</footer>

</body>
</html>
